<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Incargo · Mis envíos</title><link rel="stylesheet" href="incargo-app.css"><script src="incargo-client.js" defer></script></head><body>
<header><a class="brand" href="/">◈ INCARGO</a><span>ÁREA DE CLIENTE</span></header>
<main><p id="notice" role="status" aria-live="polite"></p>
<section id="login"><h1>Consulta tus envíos</h1><p>Ingresa con la cuenta que Incargo haya vinculado a tus entregas.</p><form id="login-form"><label>Correo <input name="email" type="email" autocomplete="username" required></label><label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label><button>Ingresar</button></form></section>
<section id="client-workspace" hidden><div class="row"><div><p class="muted" id="account-name"></p><h1>Mis envíos</h1></div><button id="logout" class="secondary" type="button">Salir</button></div><p id="list-status" role="status" aria-live="polite"></p><div id="deliveries" class="grid"></div><button id="more" class="secondary" type="button" hidden>Cargar más</button><section id="detail" class="card" aria-labelledby="detail-title" hidden><h2 id="detail-title">Hitos del envío</h2><p id="detail-status" role="status" aria-live="polite"></p><ol id="milestones"></ol></section></section>
</main></body></html>
